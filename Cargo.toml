[workspace]
resolver = "3"
members = [
    "crates/tc-core",
    "crates/tc-config",
    "crates/tc-providers",
    "crates/tc-tools",
    "crates/tc-agent",
    "crates/tc-tui",
    "crates/tc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/philppplik/true-code"
homepage = "https://github.com/philppplik/true-code"
authors = ["true-code contributors"]

[workspace.dependencies]
# Internal
tc-core = { path = "crates/tc-core", version = "0.1.0" }
tc-config = { path = "crates/tc-config", version = "0.1.0" }
tc-providers = { path = "crates/tc-providers", version = "0.1.0" }
tc-tools = { path = "crates/tc-tools", version = "0.1.0" }
tc-agent = { path = "crates/tc-agent", version = "0.1.0" }
tc-tui = { path = "crates/tc-tui", version = "0.1.0" }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
futures = "0.3"

# HTTP / streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# CLI / TUI
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Tools — the ripgrep family, so .gitignore is respected by the same rules
# developers already expect from their own tooling.
ignore = "0.4"
globset = "0.4"
regex = "1"

# Misc
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Our module docs are prose that names products and protocols; demanding
# backticks around every one of them makes the documentation harder to read.
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
